
name: Build CleanYourTV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build and test launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Check APK size
        run: |
          APK="launcher/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SIZE=$(wc -c < "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -lt 589824

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-launcher
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
